version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: labscan-db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: securecomposedbpassword123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: labscan-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_ACCESS_SECRET=167b5b5b958b0441484764382afcbd6e7142a71d0f5089d5de7924ae4b04d72bac82a72a0f732955d5d79b79dfdf1fb474d0ebf77329afad28ca46162419722f
      - JWT_REFRESH_SECRET=c0eed956190d54475a668519178258dc4a0c78e5c9241f885b50cdd895c43bbc4770f9e9597f34b511b0a3dfcff2c9062a4789455500811307c1bcbc5e526338
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - DATABASE_URL=postgresql://postgres:securecomposedbpassword123@db:5432/postgres?sslmode=disable
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80
      - MEDIA_SIGN_SECRET=mediasignkey123!
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: labscan-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
