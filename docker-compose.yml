version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: labscan-db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insecure-composedb-password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: labscan-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-insecure-dev-jwt-access-secret-key-32-characters-minimum}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-insecure-dev-jwt-refresh-secret-key-32-characters-minimum}
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:insecure-composedb-password@db:5432/postgres?sslmode=disable}
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80
      - MEDIA_SIGN_SECRET=${MEDIA_SIGN_SECRET:-insecure-dev-media-signing-secret}
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: labscan-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
