version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: labscan-db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: securecomposedbpassword123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: labscan-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-d94943fcfcb6c3ab876ad1d6ad49cb376e18eea36ac2f4c669877049a928ffb295d2cec760a741e59564c2dff60f6f9c908f9f9367f14930a5621a816ce27f7df479755}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-79a04b57aa2196b7b9e4690a563b9134c2604abd8464f2b3cc937d4ded49e5e089948be9bfd607d7927fb64b9b9d2d8e4774229b5a6a6a47a6c621949f9b156e8}
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:securecomposedbpassword123@db:5432/postgres?sslmode=disable}
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80
      - MEDIA_SIGN_SECRET=${MEDIA_SIGN_SECRET:-mediasignkey123!}
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: labscan-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
